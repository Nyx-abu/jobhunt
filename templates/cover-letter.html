<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8">
<title>Cover Letter — {{CANDIDATE_NAME}} → {{COMPANY}}</title>
<style>
@font-face { font-family: 'Space Grotesk'; src: url('./fonts/space-grotesk-latin.woff2') format('woff2'); font-weight: 400 900; font-display: swap; }
@font-face { font-family: 'DM Sans'; src: url('./fonts/dm-sans-latin.woff2') format('woff2'); font-weight: 400 700; font-display: swap; }

* { box-sizing: border-box; margin: 0; padding: 0; }
@page { size: {{PAGE_WIDTH}} auto; margin: 0.6in; }
html, body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 11pt;
  line-height: 1.55;
  color: #1a1a1a;
  background: #ffffff;
}

/* Header — same identity as CV */
header {
  margin-bottom: 0.45in;
}
.name {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 22pt;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: #0a0a0a;
}
.gradient-line {
  height: 2px;
  background: linear-gradient(to right, hsl(187, 74%, 32%), hsl(270, 70%, 45%));
  margin: 6px 0 10px;
}
.contact {
  font-size: 9.5pt;
  color: #555;
  letter-spacing: 0.01em;
}
.contact span + span::before { content: ' · '; color: #bbb; padding: 0 4px; }

/* Date + recipient */
.date {
  margin-top: 0.25in;
  font-size: 10.5pt;
  color: #444;
}
.recipient {
  margin-top: 0.15in;
  font-size: 10.5pt;
  line-height: 1.4;
}
.recipient strong {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  color: hsl(270, 70%, 35%);
}

/* Body */
.salutation {
  margin-top: 0.3in;
  font-size: 11pt;
  font-weight: 500;
}
.body p {
  margin-top: 0.18in;
  text-align: left;       /* never justify — ATS / readability rule */
  hyphens: none;
}
.body p:first-of-type::first-letter {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 1.05em;
}

/* Sign-off */
.signoff {
  margin-top: 0.32in;
}
.signoff .name-typed {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 600;
  font-size: 11.5pt;
  color: #0a0a0a;
  margin-top: 0.08in;
}
.signoff .role-line {
  font-size: 10pt;
  color: #666;
  margin-top: 2px;
}

/* ATS hygiene: no columns, no tables for layout, no images carrying text */
</style>
</head>
<body>

<header>
  <div class="name">{{CANDIDATE_NAME}}</div>
  <div class="gradient-line"></div>
  <div class="contact">
    <span>{{EMAIL}}</span>
    <span>{{PHONE}}</span>
    <span>{{LOCATION}}</span>
    <span>{{LINKEDIN_DISPLAY}}</span>
    <span>{{PORTFOLIO_DISPLAY}}</span>
  </div>
</header>

<div class="date">{{DATE_LONG}}</div>

<div class="recipient">
  <strong>{{HIRING_MANAGER_OR_TEAM}}</strong><br>
  {{COMPANY}}<br>
  Re: {{ROLE}}
</div>

<div class="salutation">{{SALUTATION}}</div>

<div class="body">
  <!--
    Three paragraphs, ≤300 words total. Each one tight.
    Paragraph 1 — the hook: tie ONE specific JD requirement to ONE specific
    proof point from the candidate's CV. Lead with the proof, not the claim.
    Paragraph 2 — the company-specific signal: a recent product, blog post,
    or public bet you can name. Not generic praise.
    Paragraph 3 — the ask: a clear, low-friction next step. No "I would
    love the opportunity" filler.
  -->
  <p>{{PARAGRAPH_HOOK}}</p>
  <p>{{PARAGRAPH_COMPANY_SIGNAL}}</p>
  <p>{{PARAGRAPH_ASK}}</p>
</div>

<div class="signoff">
  <div>Best,</div>
  <div class="name-typed">{{CANDIDATE_NAME}}</div>
  <div class="role-line">{{HEADLINE}}</div>
</div>

</body>
</html>
